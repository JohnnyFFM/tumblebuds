<title>Tumblebuds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: full-bleed game canvas; a floating storybook HUD (stats top, skill tray bottom) sits over it. Single visual world, one theme by choice. */
:root{
  --ink:#5a3524; --cream:#fff6e0; --cream2:#ffe9bd; --coral:#ff7b6b; --sun:#ffc93c; --leaf:#59c36a; --sky:#8fd8f5; --shade:rgba(90,53,36,.28);
  --display:'Lilita One','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
#hud > .head{display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hud .head > *{pointer-events:auto}
#mini{flex:none;border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--shade);touch-action:none;cursor:pointer}
#card{position:fixed;left:0;right:0;bottom:24%;text-align:center;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .7s,transform .7s;color:#fff;text-shadow:0 3px 14px rgba(40,10,40,.7);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#card.show{opacity:1;transform:none}
#card small{display:block;font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:900}
#card b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,72px);line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud > *{pointer-events:auto}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none!important}
.top > *{pointer-events:auto}
.top .spacer,.top .brk{pointer-events:none}
.top .brk{flex-basis:100%;height:0;order:8;margin-top:-8px}
.top #mini{order:9;margin-inline:auto}
@media (min-width:700px){.top{flex-wrap:nowrap;align-items:flex-start}.top .brk{display:none}.top #mini{order:0;margin:0}}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:20px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--shade);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:12px;opacity:.7}
.pill svg{width:20px;height:20px}
.spacer{flex:1}
.rb{width:40px;height:40px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--shade);display:grid;place-items:center;font-weight:900;font-size:14px;transition:transform .08s}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.rb svg{width:18px;height:18px;fill:var(--ink)}
.rb.on{background:var(--sun)}
.rb.off svg{opacity:.35}
#bFinish{width:auto;padding:0 14px;border-radius:20px;background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.bar{display:flex;gap:8px;justify-content:center;align-items:flex-end}
.skill{position:relative;width:66px;height:80px;border-radius:18px;background:linear-gradient(var(--cream),var(--cream2));border:3px solid var(--ink);box-shadow:0 5px 0 var(--shade);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.skill canvas{width:58px;height:58px;position:absolute;top:1px;left:1px;pointer-events:none}
.skill .lbl{font-size:11px;font-weight:900;letter-spacing:.02em;max-width:100%;white-space:nowrap;overflow:hidden;position:relative}
.skill .cnt{position:absolute;bottom:100%;right:7px;margin-bottom:-1px;min-width:22px;height:18px;padding:0 5px;border-radius:9px 9px 0 0;background:var(--coral);color:#fff;border:3px solid var(--ink);border-bottom:0;font-size:12px;line-height:1;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.skill.sel{transform:translateY(-10px) scale(1.06);background:linear-gradient(#fff3b0,var(--sun));box-shadow:0 12px 0 var(--shade),0 0 0 4px rgba(255,255,255,.8)}
.skill.empty{filter:grayscale(.9);opacity:.6}
.skill.empty .cnt{background:#998}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--cream);padding:8px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(255,246,224,.35),rgba(90,53,36,.42))}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,112px);line-height:.95;color:var(--cream);letter-spacing:.01em;display:flex;flex-wrap:wrap;justify-content:center;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 10px 0 var(--shade)}
.logo span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
.logo span:nth-child(3n){color:var(--sun)} .logo span:nth-child(4n+1){color:#ffd0e0}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.tag{font-size:clamp(15px,3.6vw,20px);font-weight:900;color:var(--cream);text-shadow:0 2px 0 var(--ink);max-width:30em;text-wrap:balance}
.tips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.tips span{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-size:13px;box-shadow:0 3px 0 var(--shade)}
.big{font-family:var(--display);font-size:26px;letter-spacing:.03em;color:#fff;background:linear-gradient(#ff9a7a,var(--coral));border:4px solid var(--ink);border-radius:28px;padding:12px 44px;box-shadow:0 7px 0 var(--ink),0 14px 18px var(--shade);text-shadow:0 2px 0 rgba(0,0,0,.25);animation:pulse 1.3s ease-in-out infinite}
.ghost{font-size:14px;font-weight:900;color:var(--cream);text-shadow:0 2px 0 var(--ink);text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
#toast{z-index:40}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center}
.mbtn{font-family:var(--display);font-size:20px;letter-spacing:.03em;background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:8px 28px;min-width:210px;box-shadow:0 5px 0 var(--shade);transition:transform .08s}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
.mbtn.warn{font-family:var(--body);font-size:13px;font-weight:900;min-width:0;padding:6px 16px;background:#ffe1d8}
.foot{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:11px;letter-spacing:.2em;color:var(--cream);opacity:.7;text-shadow:0 1px 0 var(--ink)}
#title.reveal .logo{animation:drop 1.1s cubic-bezier(.2,1.35,.4,1) both}
#title.reveal .tag{animation:fadeUp .8s .7s both}
#title.reveal .menu{animation:fadeUp .8s 1.1s both}
@keyframes drop{0%{opacity:0;transform:translateY(-40px) scale(1.25)}100%{opacity:1;transform:none}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
#studio{position:fixed;inset:0;z-index:60;background:#0b0f12;display:grid;place-items:center;color:#f3ead6;transition:opacity .9s;cursor:pointer}
#studio.out{opacity:0;pointer-events:none}
.st-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:stIn 3.6s ease both}
@keyframes stIn{0%{opacity:0;transform:scale(.93)}20%{opacity:1}82%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
.st-in svg{width:92px;height:92px;overflow:visible}
.st-in svg .ln{fill:none;stroke:#f3ead6;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240;stroke-dashoffset:240;animation:stDraw 1.5s .25s ease forwards}
.st-in svg .lf{fill:#74d65d;opacity:0;transform-origin:48px 22px;animation:stLeaf .6s 1.2s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes stDraw{to{stroke-dashoffset:0}}
@keyframes stLeaf{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
.st-name{font-family:var(--display);font-size:clamp(30px,8vw,56px);letter-spacing:.34em;margin-right:-.34em;line-height:1}
.st-sub{font-size:12px;letter-spacing:.5em;margin-right:-.5em;text-transform:uppercase;opacity:.6}
.card{max-height:100%;overflow-y:auto}
.card.wide{max-width:min(680px,100%);width:100%;padding:16px 18px;gap:8px}
#mapSvg{width:min(100%,calc(50vh*2.4));height:auto;display:block;border:3px solid var(--ink);border-radius:18px;touch-action:manipulation}
#mapSvg .node{cursor:pointer}
#mapSvg .cur{animation:npulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes npulse{50%{transform:scale(1.25);opacity:.25}}
.rows{display:flex;flex-direction:column;gap:9px;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:900;text-align:left}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;flex:none}
.seg button{padding:6px 11px;font-size:13px;font-weight:900;background:#fff;border-left:2px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sun)}
.row select{font:inherit;font-size:13px;color:inherit;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 8px;max-width:170px}
#settings,#pause{z-index:30}
@media (max-height:480px){.menu{flex-direction:row;flex-wrap:wrap;justify-content:center}.mbtn{min-width:0;font-size:17px;padding:6px 20px}.big{font-size:21px;padding:8px 32px}.card{padding:12px 18px;gap:6px}.rows{gap:5px}.seg button{padding:4px 10px}#mapSvg{width:min(100%,calc(40vh*2.4))}.card h2{font-size:22px}.screen{padding-block:8px}.row{font-size:13px}.mbtn.warn{padding:4px 14px}.stars i{width:34px;height:34px}}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.05)}}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:20px 26px;box-shadow:0 8px 0 var(--shade);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(420px,100%)}
.card h2{font-family:var(--display);font-size:clamp(26px,7vw,38px);font-weight:400;text-wrap:balance}
.stars{display:flex;gap:8px}
.stars i{width:46px;height:46px;background:#d9c9a8;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%);transform:scale(.6);transition:transform .5s cubic-bezier(.3,1.8,.5,1),background .3s}
.stars i.on{background:var(--sun);transform:scale(1)}
.sub{font-size:13px;opacity:.75}
@media (max-height:480px){.skill{height:64px;width:60px}.skill canvas{width:48px;height:48px;left:3px;top:0}.tips{display:none}.screen{gap:10px}}
@media (max-width:400px){.bar{gap:5px}.skill{width:60px}.skill canvas{width:52px;height:52px;left:1px;top:4px}.skill .lbl{font-size:10px}.top{gap:6px}.pill{padding:0 9px}}
@media (max-height:480px){.card h2{font-size:20px}.card{padding:10px 16px;gap:5px}.rows{gap:4px}.seg button{padding:3px 10px;font-size:12px}.row select{padding:2px 8px}.card .mbtn{padding:5px 20px;font-size:16px}.card .mbtn.warn{font-size:12px;padding:3px 12px}}
@media (prefers-reduced-motion:reduce){.logo span,.big{animation:none}}
</style>
</head>

<div id="studio"><div class="st-in">
  <svg viewBox="0 0 96 96" aria-hidden="true"><path class="lf" d="M48 22c-2-9-11-13-19-10 1 8 9 13 19 10z"/><path class="lf" d="M48 22c2-9 11-13 19-10-1 8-9 13-19 10z"/><path class="ln" d="M48 22v8M22 72c6-4 8-10 8-20 0-12 8-22 18-22s18 10 18 22c0 10 2 16 8 20zM42 78a6 6 0 0 0 12 0"/></svg>

<script>
"use strict";
//#SIM-START
const W=1600,H=520,WATER_Y=452,D=10,MAXFALL=140,MAXUP=7,MAXDN=5;
const TOTAL=20,NEED=12,SPAWN_EVERY=84,TIME_LIMIT=5*60*60;
const HATCH={x:130,y:96},EXIT={x:1492,y:370};
const solid=new Uint8Array(W*H);let solid0=null;
const G={buds:[],spawned:0,saved:0,lost:0,tick:0,ended:false,counts:{}};
const FX={carve(){},plank(){},ev(){}};
function S(x,y){x|=0;y|=0;if(x<0||x>=W)return 1;if(y<0||y>=H)return 0;return solid[y*W+x];}
function wav(x){return Math.round(2.5*Math.sin(x*0.045)+1.5*Math.sin(x*0.11+1));}
function land(x0,x1,top,bot,flat){for(let x=x0;x<x1;x++){const t=top+(flat?0:wav(x));for(let y=Math.max(0,t);y<Math.min(H,bot);y++)solid[y*W+x]=1;}}
function pillar(x0,x1,top,bot){const cx=(x0+x1)/2,hw=(x1-x0)/2;for(let x=x0;x<x1;x++){const u=(x+.5-cx)/hw;const t=Math.round(top+(1-Math.sqrt(Math.max(0,1-u*u)))*16);for(let y=t;y<bot;y++)solid[y*W+x]=1;}}
function surfaceY(x){for(let y=0;y<H;y++)if(solid[y*W+x])return y;return H;}
function buildLevel(){
  solid.fill(0);
  land(0,560,220,H);            // start plateau
  pillar(0,50,104,232);         // left wall
  pillar(380,440,108,232);      // rock 1  -> tunnel
  land(610,640,205,H);          // column after gap 1 -> bridge
  land(640,900,205,250);        // shelf   -> dig
  land(640,840,295,H);          // ledge under shelf
  land(840,1330,385,H);         // lower meadow
  pillar(1180,1250,250,397);    // rock 2  -> tunnel
  land(1380,1600,370,H);        // home bank (gap 2 -> bridge)
  pillar(1560,1600,250,382);
  EXIT.y=surfaceY(EXIT.x);
  solid0=solid.slice();
}
function resetSim(){
  solid.set(solid0);G.buds=[];G.spawned=0;G.saved=0;G.lost=0;G.tick=0;G.ended=false;
  G.counts={stop:3,build:5,dig:3,bash:3,float:5};
}
function carve(x,y,w,h){
  const x0=Math.max(0,x),x1=Math.min(W,x+w),y0=Math.max(0,y),y1=Math.min(H,y+h);
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)solid[yy*W+xx]=0;
  FX.carve(x0,y0,x1-x0,y1-y0);
}
function plank(x,y,w,h){
  const x0=Math.max(0,x),x1=Math.min(W,x+w),y0=Math.max(0,y),y1=Math.min(H,y+h);
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)if(!solid[yy*W+xx])solid[yy*W+xx]=2;
  FX.plank(x0,y0,x1-x0,y1-y0);
}
function kill(c,how){c.gone=true;G.lost++;FX.ev(how,c);}
function canAssign(c,sk){
  if(!c||c.gone||c.st==='exit')return false;
  if(!(G.counts[sk]>0))return false;
  if(sk==='float')return !c.float&&c.st!=='stop';
  if(c.st==='fall'||c.st==='stop')return false;
  return c.st!==sk;
}
function assign(c,sk){
  if(!canAssign(c,sk))return false;
  G.counts[sk]--;
  if(sk==='float')c.float=true;else{c.st=sk;c.w=0;c.planks=0;c.air=false;c.did=false;c.pre=0;}
  FX.ev('assign',c);return true;
}
function release(c){if(c.st!=='stop')return false;c.st='walk';FX.ev('assign',c);return true;}
function walkStep(c){
  for(const s of G.buds){
    if(s.st!=='stop'||s===c||Math.abs(s.y-c.y)>=14)continue;
    const d=(s.x-c.x)*c.dir;if(d>0&&d<=8){c.dir=-c.dir;return 'turn';}
  }
  const nx=c.x+c.dir;
  if(S(nx,c.y-1)){
    let up=1;while(up<=MAXUP&&S(nx,c.y-1-up))up++;
    if(up>MAXUP){c.dir=-c.dir;return 'wall';}
    c.y-=up;c.x=nx;
  }else{
    let dn=0;while(dn<=MAXDN&&!S(nx,c.y+dn))dn++;
    c.x=nx;
    if(dn>MAXDN){c.st='fall';c.fall=0;return 'fall';}
    c.y+=dn;
  }
  return 'ok';
}
function upd(c){
  c.age++;
  if(c.st==='exit'){if(++c.w>36)c.gone=true;return;}
  if(c.st==='fall'){
    const sp=(c.float&&c.fall>18)?1:3;
    for(let i=0;i<sp;i++){
      if(S(c.x,c.y)){
        if(c.fall>MAXFALL&&!c.float){kill(c,'splat');return;}
        FX.ev('land',c);c.st='walk';c.fall=0;return;
      }
      c.y++;c.fall++;
      if(c.y>WATER_Y+8){kill(c,'drown');return;}
    }
    return;
  }
  if(c.st!=='stop'&&Math.abs(c.x-EXIT.x)<6&&Math.abs(c.y-EXIT.y)<16){c.st='exit';c.w=0;G.saved++;FX.ev('saved',c);return;}
  switch(c.st){
    case 'walk':if(c.age%2===0)walkStep(c);break;
    case 'stop':if(!S(c.x,c.y)){c.st='fall';c.fall=0;}break;
    case 'dig':{
      if(c.age%4)break;
      if(c.y>=WATER_Y-14){c.st='walk';break;}
      carve(c.x-7,c.y,14,1);c.y++;FX.ev('dig',c);
      let any=0;for(let dx=-7;dx<7;dx++)if(S(c.x+dx,c.y)){any=1;break;}
      if(!any){c.st='fall';c.fall=0;}
      break;}
    case 'build':{
      c.w++;if(c.w%22)break;
      if(S(c.x+c.dir*3,c.y-22)||(S(c.x+c.dir*11,c.y-5)&&S(c.x+c.dir*11,c.y-12))){c.st='walk';break;}
      plank(c.dir>0?c.x+1:c.x-10,c.y-3,10,4);c.planks++;
      c.x+=c.dir*6;c.y-=3;FX.ev('plank',c);
      const gx=c.x+c.dir*8;let d=0;while(d<30&&!S(gx,c.y+d))d++;
      if(d>=16)c.air=true;else if(c.air&&d<=12){c.st='walk';break;}
      if(c.planks>=20)c.st='walk';
      break;}
    case 'bash':{
      const ax=c.x+c.dir*8;
      if(ax<2||ax>W-3){c.st='walk';break;}
      const ahead=S(ax,c.y-9)||S(ax,c.y-13)||S(ax,c.y-18);
      if(ahead){
        if(c.age%3)break;
        carve(c.dir>0?c.x+1:c.x-8,c.y-20,8,20);c.x+=c.dir;c.did=true;FX.ev('bash',c);
        let dn=0;while(dn<=MAXDN&&!S(c.x,c.y+dn))dn++;
        if(dn>MAXDN){c.st='fall';c.fall=0;}else c.y+=dn;
      }else if(c.did)c.st='walk';
      else if(c.age%2===0){walkStep(c);if(++c.pre>600&&c.st==='bash')c.st='walk';}
      break;}
  }
}
function stepSim(){
  if(G.ended)return;
  G.tick++;
  if(G.spawned<TOTAL&&G.tick>=90&&(G.tick-90)%SPAWN_EVERY===0){
    G.buds.push({id:G.spawned++,x:HATCH.x,y:HATCH.y+6,dir:1,st:'fall',fall:0,float:false,age:0,w:0,seed:(G.spawned*0.618)%1,gone:false});
    FX.ev('spawn',G.buds[G.buds.length-1]);
  }
  let gone=false;
  for(const c of G.buds){upd(c);if(c.gone)gone=true;}
  if(gone)G.buds=G.buds.filter(c=>!c.gone);
  if(G.tick>=TIME_LIMIT||(G.spawned>=TOTAL&&G.buds.length===0)){G.ended=true;FX.ev('end',null);}
}

/* ---------- particles ---------- */
let parts=[];const colCache={},PMAX=1100;let PA=null,PN=null,PL=null;

function P(x,y,vx,vy,life,size,col,type,grav,z0){if(type==='text'||parts.length>=640)return;parts.push({x,y,z:(z0||0)+(Math.random()-.5)*14,vx,vy,vz:(Math.random()-.5)*.5,life,max:life,size:type==='ring'?size*.6:size,col:hexRGB(col),add:type==='star'||type==='ring'||type==='heart',type:type||'dot',g:grav||0,rot:Math.random()*6});}

function updParts(k){
  for(const p of parts){p.x+=p.vx*k;p.y+=p.vy*k;p.z+=p.vz*k;p.vy+=p.g*k;p.life-=k;if(p.type==='petal'){p.vx+=Math.sin(p.life*.1+p.rot)*.02*k;p.vx*=.98;}}

function mkPts(additive,sc){

  geo.setAttribute('position',new T3.BufferAttribute(p,3));geo.setAttribute('aCol',new T3.BufferAttribute(c,4));geo.setAttribute('aSize',new T3.BufferAttribute(sz,1));

    fragmentShader:additive?'varying vec4 vC;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,d);a=a*a;gl_FragColor=vec4(vC.rgb*a*vC.a,1.);}':'varying vec4 vC;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vC.rgb,smoothstep(.5,.34,d)*vC.a);}'});

function pp(sy,x,y,zz,r,g,b,a,size){const i=sy.n;if(i>=PMAX)return;sy.p[i*3]=x;sy.p[i*3+1]=y;sy.p[i*3+2]=zz;sy.c[i*4]=r;sy.c[i*4+1]=g;sy.c[i*4+2]=b;sy.c[i*4+3]=a;sy.s[i]=size;sy.n++;}

function fillParticles(t){

  }

  for(const c of G.buds){const cz=bz(c.x);pp(PL,c.x,-c.y+16,2+cz,1,1,1,.36,96);if(dusk>.04)pp(PA,c.x,-c.y+23,3+cz,1,.85,.45,dusk*.85,13);}

/* ---------- audio ---------- */
let AC=null,master=null,soundOn=!!CFG.sfx,musicOn=!!CFG.music,musicTimer=null,mStep=0,mNext=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);mNext=AC.currentTime+.2;musicTimer=setInterval(music,90);}catch(e){AC=null;}
}
function tone(f,dur,type,vol,when,slide){
  if(!AC)return;const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
let nbuf=null;
function noise(dur,vol,freq,q){
  if(!AC)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const mt=n=>440*Math.pow(2,(n-69)/12);
const PENTA=[72,74,76,79,81,84],CH=[[48,64,67],[45,60,64],[41,57,60],[43,59,62]];
const MEL=[2,-1,3,2,1,-1,0,-1,2,-1,4,3,2,-1,-1,-1,3,-1,4,5,4,-1,3,-1,2,3,2,1,0,-1,-1,-1];
function music(){
  if(!AC||AC.state!=='running')return;
  while(mNext<AC.currentTime+.25){
    const w=mNext-AC.currentTime,st=mStep%32,ch=CH[(mStep>>3)&3];
    if(!musicOn){mNext+=.29;mStep++;continue;}
    if(st%8===0)tone(mt(ch[0]),.9,'sine',.13,w);
    if(st%8===4)tone(mt(ch[0]+7),.5,'sine',.08,w);
    if(st%2===1)tone(mt(ch[1+((st>>1)&1)]),.35,'triangle',.035,w);
    const m=MEL[st];if(m>=0&&((mStep>>5)&1?st%4!==3:true))tone(mt(PENTA[m]),.42,'triangle',.07,w);
    mNext+=.29;mStep++;
  }
}
let lastTick=0;
const SFX={
  assign(){tone(660,.09,'triangle',.18);tone(990,.14,'triangle',.16,.07);},
  nope(){tone(220,.12,'square',.07,0,.7);},
  dig(){const n=performance.now();if(n-lastTick>110){lastTick=n;noise(.07,.16,900,1.5);}},
  bash(){const n=performance.now();if(n-lastTick>130){lastTick=n;noise(.06,.2,1800,3);tone(170,.06,'square',.05);}},
  plank(){tone(520+Math.random()*60,.06,'square',.07);noise(.04,.12,2600,2);},
  splat(){noise(.18,.25,500,.8);tone(300,.25,'sine',.14,0,.4);},
  drown(){noise(.3,.25,1300,.7);tone(500,.3,'sine',.1,0,.35);},
  saved(i){const n=PENTA[i%6]+(i>=6?12:0)-12;tone(mt(n),.3,'triangle',.2);tone(mt(n+7),.4,'sine',.14,.08);},
  spawn(){tone(880,.07,'sine',.08,0,1.5);},
  win(){[72,76,79,84,88].forEach((n,i)=>tone(mt(n),.5,'triangle',.2,i*.13));},
  lose(){[67,63,60,55].forEach((n,i)=>tone(mt(n),.5,'triangle',.16,i*.2));},
  ui(){tone(740,.05,'triangle',.1);}
};
function sfx(n,a){if(AC&&soundOn)SFX[n](a);}

/* ---------- sim events -> juice ---------- */
let shake=0,slow=0,flash=0;
FX.ev=(n,c)=>{
  if(n==='end'){endGame();return;}
  const x=c.x,y=c.y-D/2;
  if(n==='land'){if(c.fall>26){burst(x,y,6,['#e8d2a6','#cfe8a0'],'dot',1,.02,22,1.6);}}
  else if(n==='splat'){burst(x,y-6,16,['#ffd24a','#ff8fb0','#fff','#74d65d'],'petal',2.2,.03,70,3);P(x,y-8,0,0,26,14,'#fff','ring');shake=5;sfx('splat');}
  else if(n==='drown'){for(let i=0;i<14;i++)P(x+(Math.random()-.5)*8,WATER_Y,(Math.random()-.5)*2.4,-1.5-Math.random()*2.5,40,1.6+Math.random()*1.4,'#d8f6ff','dot',.12);P(x,WATER_Y+1,0,0,36,18,'#fff','ring');sfx('drown');}
  else if(n==='saved'){burst(EXIT.x,EXIT.y-16,10,['#fff3a0','#ffd24a','#fff'],'star',1.6,0,46,4.5);P(EXIT.x,EXIT.y-30,0,-.5,60,4,'#ff6b8b','heart');P(EXIT.x,EXIT.y-46,0,-.35,70,0,'#fff3a0','text',0,G.saved+(G.saved===NEED?' ★':''));sfx('saved',G.saved-1);if(G.saved===NEED){slow=1.1;flash=.28;}}
  else if(n==='dig'){for(let i=0;i<2;i++)P(x+(Math.random()-.5)*12,y+2,(Math.random()-.5)*1.6,-1-Math.random()*1.4,26,1.3+Math.random(),Math.random()<.5?'#c98a56':'#8a5540','dot',.12);sfx('dig');}
  else if(n==='bash'){for(let i=0;i<2;i++)P(x+c.dir*9,y-4-Math.random()*14,-c.dir*(.4+Math.random()*1.6),-Math.random()*1.5,28,1.3+Math.random()*1.2,Math.random()<.5?'#c98a56':'#e2c49a','dot',.12);sfx('bash');}
  else if(n==='plank'){burst(x+c.dir*4,y+2,3,['#ffe2a8','#fff'],'dot',.8,.02,16,1.2);sfx('plank');}
  else if(n==='assign'){P(x,y-9,0,0,24,16,'#fff','ring');burst(x,y-10,7,['#fff3a0','#fff','#ffd0e0'],'star',1.5,0,30,3.6);sfx('assign');}
  else if(n==='spawn'){burst(HATCH.x,HATCH.y+4,5,['#74d65d','#b6ee8a'],'petal',1,.03,40,2.5);sfx('spawn');}
};

    const p=budScreen(c);let d=Math.hypot(p[0]-sx,p[1]-sy);if(d>Rr)continue;if(st)d=d*1.4+2;

function tap(sx,sy){

    syncHud(true);return;
  }
  const Rr=Math.max(28,15*z);
  const near=G.buds.some(b=>{const p=budScreen(b);return Math.hypot(p[0]-sx,p[1]-sy)<Rr;});

/* ---------- main loop ---------- */
let last=0,acc=0,iconT=0,ft=.016,fc=0,mc=0;
function frame(ms){
  requestAnimationFrame(frame);
  const now=ms/1000,dt=Math.min(.05,now-last||0);last=now;T+=dt;
  ft=ft*.96+dt*.04;if(++fc>150){fc=0;if(CFG.gfx==='auto'&&ft>.027){if(rscale>1){rscale=Math.max(1,rscale-.5);ft=.016;resize();}else setLow(true);}}
  if(mode==='title')setTod(.5-.5*Math.cos(T*TAU/50));else setTod(G.tick/(170*60));
  let bt=0;
  if(cine){if(!cine.hold)cine.t+=dt;bt=.105*clamp(Math.min(cine.t/.6,(cine.dur-cine.t)/1),0,1);if(cine.t>=cine.dur)endCine();}
  bars+=(bt-bars)*Math.min(1,dt*8);if(bars<.0005)bars=0;
  if(mode==='play'){
    if(introT>0){if(!cine)introT-=dt;}
    else if(!paused&&!menuOpen){let sp=speed;if(slow>0){slow-=dt;sp=.3;}acc+=dt*60*sp;let n=0;while(acc>=1&&n<10){stepSim();acc-=1;n++;}if(n>=10)acc=0;}
    syncHud(false);
    if(sel&&!(G.counts[sel]>0))sel=null;
    const mo=!miniOn();if(mini.hidden!==mo)mini.hidden=mo;
    if(!mo&&++mc%4===0)drawMini();
  }else if(mode==='end'){acc+=dt*60;while(acc>=1){for(const c of G.buds)if(c.st==='exit')upd(c);acc-=1;}}
  updParts(dt*60);if(shake>0)shake=Math.max(0,shake-dt*24);if(flash>0)flash=Math.max(0,flash-dt*.7);
  if(Math.random()<dt*2)P(EXIT.x+(Math.random()-.5)*50,EXIT.y-20-Math.random()*60,(Math.random()-.5)*.2,-.25,70,2.2,'#fff3a0','star');
  if(Math.random()<dt*5)P(EXIT.x-22,EXIT.y-88,.04+Math.random()*.12,-.3-Math.random()*.1,200,3+Math.random()*3,'#cfc8c0','dot',-.0006,-34);
  if(Math.random()<dt*1.6)P(camX+Math.random()*vw/z*1.2,camY-6,-.25-Math.random()*.4,.3+Math.random()*.3,520,1.2+Math.random()*1,Math.random()<.5?'#e8d9a0':'#c9d6a0','petal',.0004);
  render(T,dt);
  iconT+=dt;if(iconT>.05&&mode==='play'){iconT=0;drawSkillIcons(T);}
}

/* ---------- boot ---------- */
'TUMBLEBUDS'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(i*.09)+'s';$('logo').append(s);});
buildLevel();resetSim();buildSkillBar();
try{
  R=new T3.WebGLRenderer({canvas:cv,antialias:false,alpha:false,powerPreference:'high-performance'});
  R.outputEncoding=T3.sRGBEncoding;R.toneMapping=T3.ACESFilmicToneMapping;R.toneMappingExposure=1.02;
  R.shadowMap.enabled=true;R.shadowMap.type=T3.PCFSoftShadowMap;R.shadowMap.autoUpdate=false;R.setClearColor(0x000000,1);
}catch(e){document.querySelector('#title .tag').textContent=tr(32);$('bPlay').hidden=true;throw e;}
cv.addEventListener('webglcontextlost',e=>e.preventDefault());
initEnv();initTerrain();initWorld();initProps();
PA=mkPts(true,scene);PN=mkPts(false,scene);PL=mkPts(true,lightScene);
initPost();paintMap();applyGfx();z=defaultZoom();clampCam();drawSkillIcons(0);
requestAnimationFrame(frame);
if(location.hash==='#play')startGame();

</script>
