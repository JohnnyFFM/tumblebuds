<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Tumblebuds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: full-bleed game canvas; a floating storybook HUD (stats top, skill tray bottom) sits over it. Single visual world, one theme by choice. */
:root{
  --ink:#5a3524; --cream:#fff6e0; --cream2:#ffe9bd; --coral:#ff7b6b; --sun:#ffc93c; --leaf:#59c36a; --sky:#8fd8f5; --shade:rgba(90,53,36,.28);
  --display:'Lilita One','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#10181d;color:var(--ink);font-family:var(--body);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
/* iOS home-screen app: the page is laid out with the wrong height, so the script pins every full-screen layer to the real screen height (--appH) */
html.iosapp{min-height:calc(100% + env(safe-area-inset-top,0px))}
.iosapp #cv,.iosapp #hud,.iosapp .screen,.iosapp #studio{height:var(--appH);bottom:auto;box-sizing:border-box}
.iosapp #toast{bottom:auto;top:calc(var(--appH) - 150px - env(safe-area-inset-bottom,0px))}
.iosapp .foot{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#hud > .head{display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hud .head > *{pointer-events:auto}
#mini{flex:none;border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--shade);touch-action:none;cursor:pointer}
#card{position:fixed;left:0;right:0;bottom:24%;text-align:center;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .7s,transform .7s;color:#fff;text-shadow:0 3px 14px rgba(40,10,40,.7);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#card.show{opacity:1;transform:none}
#card small{display:block;font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:900}
#card b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,72px);line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud > *{pointer-events:auto}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none!important}
.top > *{pointer-events:auto}
.top .spacer,.top .brk{pointer-events:none}
.top .brk{flex-basis:100%;height:0;order:8;margin-top:-8px}
.top #mini{order:9;margin-inline:auto}
@media (min-width:700px){.top{flex-wrap:nowrap;align-items:flex-start}.top .brk{display:none}.top #mini{order:0;margin:0}}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:20px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--shade);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:12px;opacity:.7}
.pill svg{width:20px;height:20px}
.spacer{flex:1}
.rb{width:40px;height:40px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--shade);display:grid;place-items:center;font-weight:900;font-size:14px;transition:transform .08s}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.rb svg{width:18px;height:18px;fill:var(--ink)}
.rb.on{background:var(--sun)}
#bPause.on{animation:pulse 1s ease-in-out infinite}
.rb.off svg{opacity:.35}
#bFinish{width:auto;padding:0 14px;border-radius:20px;background:var(--leaf);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
#bFinish.pop{width:40px;padding:0;border-radius:50%;background:var(--cream);color:var(--ink);text-shadow:none;font-size:19px}
#bFinish.pop.arm{background:var(--coral);color:#fff}
.bar{display:flex;gap:8px;justify-content:center;align-items:flex-end}
.skill{position:relative;width:66px;height:80px;border-radius:18px;background:linear-gradient(var(--cream),var(--cream2));border:3px solid var(--ink);box-shadow:0 5px 0 var(--shade);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.skill canvas{width:58px;height:58px;position:absolute;top:1px;left:1px;pointer-events:none}
.skill .lbl{font-size:11px;font-weight:900;letter-spacing:.02em;max-width:100%;white-space:nowrap;overflow:hidden;position:relative}
.skill .cnt{position:absolute;bottom:100%;right:7px;margin-bottom:-1px;min-width:22px;height:18px;padding:0 5px;border-radius:9px 9px 0 0;background:var(--coral);color:#fff;border:3px solid var(--ink);border-bottom:0;font-size:12px;line-height:1;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.skill.sel{transform:translateY(-10px) scale(1.06);background:linear-gradient(#fff3b0,var(--sun));box-shadow:0 12px 0 var(--shade),0 0 0 4px rgba(255,255,255,.8)}
.skill.empty{filter:grayscale(.9);opacity:.6}
.skill.empty .cnt{background:#998}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--cream);padding:8px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(255,246,224,.35),rgba(90,53,36,.42))}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,112px);line-height:.95;color:var(--cream);letter-spacing:.01em;display:flex;flex-wrap:wrap;justify-content:center;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 10px 0 var(--shade)}
.logo span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
.logo span:nth-child(3n){color:var(--sun)} .logo span:nth-child(4n+1){color:#ffd0e0}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.tag{font-size:clamp(15px,3.6vw,20px);font-weight:900;color:var(--cream);text-shadow:0 2px 0 var(--ink);max-width:30em;text-wrap:balance}
.tips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.tips span{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-size:13px;box-shadow:0 3px 0 var(--shade)}
.big{font-family:var(--display);font-size:26px;letter-spacing:.03em;color:#fff;background:linear-gradient(#ff9a7a,var(--coral));border:4px solid var(--ink);border-radius:28px;padding:12px 44px;box-shadow:0 7px 0 var(--ink),0 14px 18px var(--shade);text-shadow:0 2px 0 rgba(0,0,0,.25);animation:pulse 1.3s ease-in-out infinite}
.ghost{font-size:14px;font-weight:900;color:var(--cream);text-shadow:0 2px 0 var(--ink);text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
#toast{z-index:40}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center}
.mbtn{font-family:var(--display);font-size:20px;letter-spacing:.03em;background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:8px 28px;min-width:210px;box-shadow:0 5px 0 var(--shade);transition:transform .08s}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
.mbtn.warn{font-family:var(--body);font-size:13px;font-weight:900;min-width:0;padding:6px 16px;background:#ffe1d8}
.foot{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:11px;letter-spacing:.2em;color:var(--cream);opacity:.7;text-shadow:0 1px 0 var(--ink)}
#title.reveal .logo{animation:drop 1.1s cubic-bezier(.2,1.35,.4,1) both}
#title.reveal .tag{animation:fadeUp .8s .7s both}
#title.reveal .menu{animation:fadeUp .8s 1.1s both}
@keyframes drop{0%{opacity:0;transform:translateY(-40px) scale(1.25)}100%{opacity:1;transform:none}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
#studio{position:fixed;inset:0;z-index:60;background:#0b0f12;display:grid;place-items:center;color:#f3ead6;transition:opacity .9s;cursor:pointer}
#studio.out{opacity:0;pointer-events:none}
.st-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:stIn .9s ease both}
@keyframes stIn{0%{opacity:0;transform:scale(.93)}100%{opacity:1;transform:none}}
.st-in svg{width:92px;height:92px;overflow:visible}
.st-in svg .ln{fill:none;stroke:#f3ead6;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240;stroke-dashoffset:240;animation:stDraw 1.5s .25s ease forwards}
.st-in svg .lf{fill:#74d65d;opacity:0;transform-origin:48px 22px;animation:stLeaf .6s 1.2s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes stDraw{to{stroke-dashoffset:0}}
@keyframes stLeaf{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
.st-name{font-family:var(--display);font-size:clamp(30px,8vw,56px);letter-spacing:.34em;margin-right:-.34em;line-height:1}
.st-sub{font-size:12px;letter-spacing:.5em;margin-right:-.5em;text-transform:uppercase;opacity:.6}
.st-go{margin-top:22px;width:78px;height:78px;border-radius:50%;background:var(--coral);border:4px solid #f3ead6;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.4);opacity:0;animation:stGo .5s 1.9s cubic-bezier(.3,1.8,.5,1) forwards,pulse 1.2s 2.5s ease-in-out infinite}
.st-in .st-go svg{width:40px;height:40px;margin-left:4px}
@keyframes stGo{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
.card{max-height:100%;overflow-y:auto}
#card i{display:block;font-style:normal;font-size:clamp(15px,3.4vw,21px);font-weight:900;margin-top:8px;text-wrap:balance}
#veil{position:fixed;inset:0;z-index:50;background:#0b0f12;opacity:0;pointer-events:none;transition:opacity .28s}
#veil.on{opacity:1;pointer-events:auto}
.sub2{font-family:var(--display);font-size:clamp(18px,4.6vw,30px);color:var(--sun);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);letter-spacing:.06em;margin-top:-8px}
#title.reveal .sub2{animation:fadeUp .8s .5s both}
/* world map: the 3D map is drawn on the game canvas; this layer only holds the controls and lets drags through */
#map{background:none;pointer-events:none;justify-content:space-between;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
#map button{pointer-events:auto}
.mtop{display:flex;align-items:center;gap:12px;width:100%}
.mtop .mbtn{min-width:0;padding:6px 20px;font-size:17px}
.mworld{font-family:var(--display);font-size:clamp(20px,5vw,34px);color:var(--cream);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);flex:1;text-align:center}
.mctl{display:flex;gap:6px}.mctl .rb{font-size:22px;font-family:var(--display);line-height:1}
.mpanel{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:10px 14px;box-shadow:0 7px 0 var(--shade);max-width:min(640px,100%);width:100%}
.mpanel .rb{flex:none;font-size:24px;line-height:1;font-family:var(--display)}
.minfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.minfo b{font-family:var(--display);font-weight:400;font-size:clamp(17px,4.2vw,24px);line-height:1.1;text-wrap:balance}
.mpanel .big{flex:none;font-size:20px;padding:8px 22px;border-width:3px;box-shadow:0 5px 0 var(--ink)}
.mpanel .big[disabled]{filter:grayscale(1);opacity:.55;animation:none}
.stars.sm i{width:22px;height:22px;transform:none}
@media (max-width:520px){.mpanel{flex-wrap:wrap;justify-content:center}.minfo{flex-basis:calc(100% - 110px)}.mworld{font-size:17px}.mtop{gap:6px}.mtop .mbtn{padding:6px 12px;font-size:15px}.mctl{gap:4px}.mctl .rb{width:36px;height:36px}}
.rows{display:flex;flex-direction:column;gap:9px;width:100%}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;font-size:14px;font-weight:900;text-align:left}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;flex:none}
.seg button{padding:6px 11px;font-size:13px;font-weight:900;background:#fff;border-left:2px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sun)}
.row select{font:inherit;font-size:13px;color:inherit;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 8px;max-width:170px}
#settings,#pause{z-index:30}
@media (max-height:480px){.menu{flex-direction:row;flex-wrap:wrap;justify-content:center}.mbtn{min-width:0;font-size:17px;padding:6px 20px}.big{font-size:21px;padding:8px 32px}.card{padding:12px 18px;gap:6px}.rows{gap:5px}.seg button{padding:4px 10px}.mpanel{padding:5px 12px}.mpanel .sub{display:none}.card h2{font-size:22px}.screen{padding-block:8px}.row{font-size:13px}.mbtn.warn{padding:4px 14px}.stars i{width:34px;height:34px}}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.05)}}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:20px 26px;box-shadow:0 8px 0 var(--shade);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(420px,100%)}
.card h2{font-family:var(--display);font-size:clamp(26px,7vw,38px);font-weight:400;text-wrap:balance}
.stars{display:flex;gap:8px}
.stars i{width:46px;height:46px;background:#d9c9a8;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%);transform:scale(.6);transition:transform .5s cubic-bezier(.3,1.8,.5,1),background .3s}
.stars i.on{background:var(--sun);transform:scale(1)}
.sub{font-size:13px;opacity:.75}
@media (max-height:480px){.skill{height:64px;width:60px}.skill canvas{width:48px;height:48px;left:3px;top:0}.tips{display:none}.screen{gap:10px}}
@media (max-width:400px){.bar{gap:5px}.skill{width:60px}.skill canvas{width:52px;height:52px;left:1px;top:4px}.skill .lbl{font-size:10px}.top{gap:6px}.pill{padding:0 9px}}
@media (max-height:480px){.card h2{font-size:20px}.card{padding:10px 16px;gap:5px}.rows{gap:4px}.seg button{padding:3px 10px;font-size:12px}.row select{padding:2px 8px}.card .mbtn{padding:5px 20px;font-size:16px}.card .mbtn.warn{font-size:12px;padding:3px 12px}}
@media (prefers-reduced-motion:reduce){.logo span,.big{animation:none}}
/* intro / ending movie overlay: subtitle ribbon, speech bubbles, title card, skip hint. The 3D picture itself is drawn on the game canvas. */
#mv{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.iosapp #mv{height:var(--appH);bottom:auto;box-sizing:border-box}
#mvFade{position:absolute;inset:0;background:#fff6e0;opacity:0}
#mvSkip{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:11px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:#fff;text-shadow:0 2px 6px rgba(40,10,40,.75);opacity:0}
#mvSubW{position:absolute;left:0;right:0;bottom:calc(max(18px,4.5vh) + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#mvSub{max-width:min(100%,34em);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--shade);padding:9px 20px 10px;font-family:var(--body);font-weight:900;font-size:clamp(17px,4.5vw,25px);line-height:1.25;text-align:center;text-wrap:balance;opacity:0;will-change:opacity,transform}
#mvB0,#mvB1{position:absolute;left:0;top:0;transform-origin:50% 100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--shade);padding:6px 18px 8px;font-family:var(--display);font-size:clamp(24px,6.4vw,40px);line-height:1.05;white-space:nowrap;letter-spacing:.02em;opacity:0;will-change:transform}
#mvB0::after,#mvB1::after{content:'';position:absolute;left:50%;bottom:-12px;width:18px;height:18px;margin-left:-9px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);border-bottom-right-radius:5px;transform:rotate(45deg)}
#mvTitle{position:absolute;left:0;right:0;top:calc(13% + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:0;will-change:opacity,transform}
#mvLogo{font-family:var(--display);font-size:clamp(44px,13vw,112px);line-height:.95;color:var(--cream);letter-spacing:.01em;display:flex;flex-wrap:wrap;justify-content:center;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 10px 0 var(--shade)}
#mvLogo span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
#mvLogo span:nth-child(3n){color:var(--sun)} #mvLogo span:nth-child(4n+1){color:#ffd0e0}
#mvTSub{font-family:var(--display);font-size:clamp(18px,4.6vw,30px);color:var(--sun);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);letter-spacing:.06em;margin-top:2px}
@media (orientation:landscape) and (max-height:520px){#mvSubW{bottom:calc(8px + env(safe-area-inset-bottom,0px))}#mvSub{font-size:clamp(16px,4.4vh,22px);padding:6px 18px 7px}#mvTitle{top:calc(9% + env(safe-area-inset-top,0px))}#mvLogo{font-size:clamp(40px,19vh,96px)}}
@media (prefers-reduced-motion:reduce){#mvLogo span{animation:none}}
/* ===== polish pass: interface. Every rule sits behind a lab class on <html> (L-<labId>, kept in step by labCss()) or a class only the lab code sets, so a switched-off lab leaves the page exactly as it was ===== */
/* uiPress: tactile buttons, springy release, bigger hit areas, focus rings */
html.L-uiPress .rb,html.L-uiPress .mbtn{position:relative;transition:transform .3s cubic-bezier(.3,2.1,.5,1),box-shadow .16s,background-color .15s}
html.L-uiPress .rb:active{transition-duration:.05s;transform:translateY(3px) scale(.94)}
html.L-uiPress .mbtn:active{transition-duration:.05s;transform:translateY(4px) scale(.97)}
html.L-uiPress .rb::after,html.L-uiPress .mbtn::after,html.L-uiPress .ghost::after{content:'';position:absolute;inset:-5px;border-radius:inherit}
html.L-uiPress .mbtn.warn::after,html.L-uiPress .ghost::after{inset:-8px -4px}
html.L-uiPress .ghost{position:relative}
html.L-uiPress .screen .big:active,html.L-uiPress .mpanel .big:active{animation:none;transform:translateY(5px) scale(.97)}
html.L-uiPress .skill:active{transform:translateY(3px) scale(.95);box-shadow:0 2px 0 var(--shade)}
html.L-uiPress .skill.sel:active{transform:translateY(-6px) scale(1.01)}
html.L-uiPress .seg button:active{background:var(--cream2)}
html.L-uiPress select:focus-visible,html.L-uiPress summary:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
@media (hover:hover){html.L-uiPress .rb:hover,html.L-uiPress .mbtn:hover{transform:translateY(-2px)}html.L-uiPress .rb:hover:active{transform:translateY(3px) scale(.94)}html.L-uiPress .mbtn:hover:active{transform:translateY(4px) scale(.97)}}
/* uiMenus: screens ease in, their children one after the other (transforms only, so nothing in the layout moves) */

function buildLevel(i){
  LVL=i;const L=LEVELS[i];solid.fill(0);L.b();
  TOTAL=L.n;NEED=L.need;TIME_LIMIT=L.t*3600;MAXFALL=L.g?240:140;FALLV=L.g?2:3;GRAV=L.g?.075:.11;
  HATCH.x=L.hx;HATCH.y=Math.max(14,surfaceY(L.hx)-120);EXIT.x=L.ex;EXIT.y=surfaceY(L.ex);
  solid0=solid.slice();
}
function resetSim(){
  solid.set(solid0);G.buds=[];G.items=[];G.spawned=0;G.saved=0;G.lost=0;G.tick=0;G.ended=false;
  G.counts=Object.assign({stop:0,build:0,dig:0,bash:0,float:0,tramp:0,jet:0,run:0,bomb:0,bub:0,climb:0},LEVELS[LVL].c);
}
function carve(x,y,w,h){
  const x0=Math.max(0,x),x1=Math.min(W,x+w),y0=Math.max(0,y),y1=Math.min(H,y+h);
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)solid[yy*W+xx]=0;
  FX.carve(x0,y0,x1-x0,y1-y0);
}
function plank(x,y,w,h){
  const x0=Math.max(0,x),x1=Math.min(W,x+w),y0=Math.max(0,y),y1=Math.min(H,y+h);
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)if(!solid[yy*W+xx])solid[yy*W+xx]=2;
  FX.plank(x0,y0,x1-x0,y1-y0);
}
function kill(c,how){c.gone=true;G.lost++;FX.ev(how,c);}
function canAssign(c,sk){
  if(!c||c.gone||c.st==='exit')return false;
  if(!(G.counts[sk]>0))return false;
  if(sk==='float'||sk==='run'||sk==='climb')return !c[sk]&&c.st!=='stop';
  if(sk==='bub')return c.st==='walk'||c.st==='fall';
  if(c.st!=='walk'&&(sk==='tramp'||sk==='jet'||sk==='bomb'))return false;
  if(c.st==='fall'||c.st==='stop'||c.st==='fly'||c.st==='bub'||c.st==='clm'||c.st==='bomb')return false;
  return c.st!==sk;
}
function assign(c,sk){
  if(!canAssign(c,sk))return false;
  G.counts[sk]--;
  if(sk==='float'||sk==='run'||sk==='climb')c[sk]=true;
  else if(sk==='tramp'){const it={x:c.x+c.dir*5,y:c.y,t:0};G.items.push(it);FX.ev('item',it);}
  else if(sk==='jet')launch(c,c.dir*2.2,-2.6,1);
  else{c.st=sk;c.w=0;c.planks=0;c.air=false;c.did=false;c.pre=0;}
  FX.ev('assign',c);return true;
}
/* a bud in the air on a ballistic arc: off a bounce pad or on a rocket */
function launch(c,vx,vy,jet){c.st='fly';c.fx=c.x;c.fy=c.y;c.vx=vx;c.vy=vy;c.fall=0;c.jet=jet;FX.ev(jet?'jet':'boing',c);}
/* give up: no more buds arrive and the ones still out pop one after another */
function nuke(){G.spawned=TOTAL;let d=0;for(const c of G.buds)if(c.st!=='exit'){c.nk=d;d+=5;}}
function release(c){if(c.st!=='stop')return false;c.st='walk';FX.ev('assign',c);return true;}
function walkStep(c){
  for(const s of G.buds){
    if(s.st!=='stop'||s===c||Math.abs(s.y-c.y)>=14)continue;
    const d=(s.x-c.x)*c.dir;if(d>0&&d<=8){c.dir=-c.dir;return 'turn';}
  }
  const nx=c.x+c.dir,MU=c.run?MAXUP*2:MAXUP;
  if(S(nx,c.y-1)){
    let up=1;while(up<=MU&&S(nx,c.y-1-up))up++;
    if(up>MU){
      /* planks are steps, never walls: a bud under a bridge walks on through it */
      let ur=0;while(ur<=MU&&S(nx,c.y-1-ur)===1)ur++;
      if(ur>MU){if(c.climb&&c.st==='walk'&&nx>=0&&nx<W){c.st='clm';return 'climb';}c.dir=-c.dir;return 'wall';}
      c.y-=ur;c.x=nx;return 'ok';
    }
    c.y-=up;c.x=nx;
  }else{
    let dn=0;while(dn<=MAXDN&&!S(nx,c.y+dn))dn++;
    c.x=nx;
    if(dn>MAXDN){c.st='fall';c.fall=0;return 'fall';}
    c.y+=dn;
  }
  return 'ok';
}
function upd(c){
  c.age++;
  if(c.st==='exit'){if(++c.w>36)c.gone=true;return;}
  if(c.nk!=null&&--c.nk<0){kill(c,'poof');return;}
  if(c.st==='fall'){
    const sp=(c.float&&c.fall>18)?1:FALLV;
    for(let i=0;i<sp;i++){
      if(S(c.x,c.y)){
        if(c.fall>MAXFALL&&!c.float){kill(c,'splat');return;}
        FX.ev('land',c);c.st='walk';c.fall=0;return;
      }
      c.y++;c.fall++;
      if(c.y>WATER_Y+8){kill(c,'drown');return;}
    }
    return;
  }
  if(c.st!=='stop'&&Math.abs(c.x-EXIT.x)<6&&Math.abs(c.y-EXIT.y)<16){c.st='exit';c.w=0;G.saved++;FX.ev('saved',c);return;}
  switch(c.st){
    case 'walk':if(c.run||c.age%2===0){walkStep(c);if(c.st==='walk')for(const it of G.items)if(Math.abs(it.x-c.x)<=2&&Math.abs(it.y-c.y)<=6){it.t=G.tick;launch(c,c.dir*.9,-4.4,0);break;}}break;
    case 'fly':{
      c.vy=Math.min(c.vy+GRAV,3.4);let nx=c.fx+c.vx,ny=c.fy+c.vy;
      if(S(Math.round(nx),Math.round(c.fy)-3)||S(Math.round(nx),Math.round(c.fy)-12))nx=c.fx;
      if(c.vy<0&&S(Math.round(nx),Math.round(ny)-19)){c.vy=0;ny=c.fy;}
      if(c.vy>0){
        const rx=Math.round(nx);let hit=-1;for(let y=Math.round(c.fy);y<=Math.round(ny);y++)if(S(rx,y)){hit=y;break;}
        c.fall+=c.vy;
        if(hit>=0){c.x=rx;c.y=hit;if(c.fall>MAXFALL&&!c.float){kill(c,'splat');return;}FX.ev('land',c);c.st='walk';c.fall=0;c.jet=0;return;}
      }
      c.fx=nx;c.fy=ny;c.x=Math.round(nx);c.y=Math.round(ny);
      if(c.y>WATER_Y+8){kill(c,'drown');return;}
      break;}
    case 'bub':{
      if(c.age%2)break;
      if(S(c.x,c.y-21)||c.w>=(GRAV<.1?170:120)||c.y<26){c.st='fall';c.fall=0;FX.ev('pop',c);break;}
      c.y--;c.w++;if(!S(c.x+c.dir,c.y-2)&&!S(c.x+c.dir,c.y-14))c.x+=c.dir;
      break;}
    case 'clm':{
      if(c.age%2)break;
      if(!S(c.x+c.dir,c.y-1)){c.x+=c.dir;c.st='walk';break;}
      if(S(c.x,c.y-21)||c.y<26){c.dir=-c.dir;c.st='fall';c.fall=0;break;}
      c.y--;break;}
    case 'bomb':{
      if(++c.w<70)break;
      for(let dy=-18;dy<=18;dy++){const hw=Math.round(Math.sqrt(18*18-dy*dy));carve(c.x+c.dir*6-hw,c.y-6+dy,hw*2+1,1);}
      FX.ev('boom',c);c.st='walk';if(!S(c.x,c.y)){c.st='fall';c.fall=0;}
      break;}
    case 'stop':if(!S(c.x,c.y)){c.st='fall';c.fall=0;}break;
    case 'wait':if(++c.w>100)c.st='walk';break;
    case 'dig':{
      if(c.age%4)break;
      if(c.y>=WATER_Y-14){c.st='walk';break;}
      carve(c.x-7,c.y,14,1);c.y++;FX.ev('dig',c);
      let any=0;for(let dx=-7;dx<7;dx++)if(S(c.x+dx,c.y)){any=1;break;}
      if(!any){c.st='fall';c.fall=0;}
      break;}
    case 'build':{
      c.w++;if(c.w%22)break;
      if(S(c.x+c.dir*3,c.y-22)||(S(c.x+c.dir*11,c.y-5)&&S(c.x+c.dir*11,c.y-12))){c.st='walk';break;}
      plank(c.dir>0?c.x+1:c.x-10,c.y-3,10,4);c.planks++;
      c.x+=c.dir*6;c.y-=3;FX.ev('plank',c);
      const gx=c.x+c.dir*2;let d=0;while(d<30&&!S(gx,c.y+d))d++;
      if(d>=16)c.air=true;else if(c.air&&d<=12){c.st='walk';break;}
      if(c.planks>=20){c.st='wait';c.w=0;FX.ev('wait',c);}   /* out of planks: wait a moment so the player can hand over another Bridge card */
      break;}
    case 'bash':{
      const ax=c.x+c.dir*8;
      if(ax<2||ax>W-3){c.st='walk';break;}
      const ahead=S(ax,c.y-9)||S(ax,c.y-13)||S(ax,c.y-18);
      if(ahead){
        if(c.age%3)break;
        carve(c.dir>0?c.x+1:c.x-8,c.y-20,8,20);c.x+=c.dir;c.did=true;FX.ev('bash',c);
        let dn=0;while(dn<=MAXDN&&!S(c.x,c.y+dn))dn++;
        if(dn>MAXDN){c.st='fall';c.fall=0;}else c.y+=dn;
      }else if(c.did)c.st='walk';
      else if(c.age%2===0){walkStep(c);if(++c.pre>600&&c.st==='bash')c.st='walk';}
      break;}
  }
}
function stepSim(){
  if(G.ended)return;
  G.tick++;
  if(G.spawned<TOTAL&&G.tick>=90&&(G.tick-90)%SPAWN_EVERY===0){
    G.buds.push({id:G.spawned++,x:HATCH.x,y:HATCH.y+6,dir:1,st:'fall',fall:0,float:false,age:0,w:0,seed:(G.spawned*0.618)%1,gone:false});
    FX.ev('spawn',G.buds[G.buds.length-1]);
  }
  let gone=false;
  for(const c of G.buds){upd(c);if(c.gone)gone=true;}
  if(gone)G.buds=G.buds.filter(c=>!c.gone);
  if(G.tick>=TIME_LIMIT||(G.spawned>=TOTAL&&G.buds.length===0)){G.ended=true;FX.ev('end',null);}
}

  else if(n==='saved'){burst(EXIT.x,EXIT.y-16,10,['#fff3a0','#ffd24a','#fff'],'star',1.6,0,46,4.5);P(EXIT.x,EXIT.y-30,0,-.5,60,4,'#ff6b8b','heart');P(EXIT.x,EXIT.y-46,0,-.35,70,0,'#fff3a0','text',0,G.saved+(G.saved===NEED?' ★':''));sfx('saved',G.saved-1);if(G.saved===NEED){slow=1.1;flash=.28;}}
  else if(n==='dig'){for(let i=0;i<2;i++)P(x+(Math.random()-.5)*12,y+2,(Math.random()-.5)*1.6,-1-Math.random()*1.4,26,1.3+Math.random(),Math.random()<.5?'#c98a56':'#8a5540','dot',.12);sfx('dig');}
  else if(n==='bash'){for(let i=0;i<2;i++)P(x+c.dir*9,y-4-Math.random()*14,-c.dir*(.4+Math.random()*1.6),-Math.random()*1.5,28,1.3+Math.random()*1.2,Math.random()<.5?'#c98a56':'#e2c49a','dot',.12);sfx('bash');}
  else if(n==='plank'){burst(x+c.dir*4,y+2,3,['#ffe2a8','#fff'],'dot',.8,.02,16,1.2);sfx('plank');}
  else if(n==='poof'){burst(x,y-6,12,FLOWER,'petal',2.2,.03,60,3);P(x,y-8,0,0,20,16,'#fff','ring');sfx('pop');}
  else if(n==='wait'){P(x,y-26,0,-.25,90,0,'#fff','ring');for(let i=0;i<3;i++)P(x+(i-1)*5,y-30,0,-.12,100,3,'#ffd24a','star');sfx('ui');}
  else if(n==='item'){burst(x,y,6,['#fff','#ffd0e0'],'star',1.4,0,24,3);sfx('plank');}
  else if(n==='boing'){P(x,y+4,0,0,20,12,'#fff','ring');sfx('boing');}
  else if(n==='jet'){burst(x,y,8,['#ffb04a','#fff3a0'],'star',1.8,0,26,4);sfx('jet');}
  else if(n==='pop'){P(x,y-8,0,0,18,16,'#d8f6ff','ring');burst(x,y-8,6,['#d8f6ff','#fff'],'dot',1.4,.03,24,1.6);sfx('pop');}

  else if(n==='assign'){P(x,y-9,0,0,24,16,'#fff','ring');burst(x,y-10,7,['#fff3a0','#fff','#ffd0e0'],'star',1.5,0,30,3.6);sfx('assign');}

const VST={fly:'fall',bub:'fall',clm:'walk',bomb:'stop',wait:'build'};
function animBud(o,c){
  const t=c.age,ph=t*(c.run?.55:.3)+c.seed*10,st=VST[c.st]||c.st,dir=c.dir,work=(st==='bash'&&c.did)||st==='dig'||st==='build',walk=st==='walk'||(st==='bash'&&!c.did);
  o.g.visible=true;
  const ty=-c.y;if(o.vy==null||st==='fall'||Math.abs(ty-o.vy)>12)o.vy=ty;else o.vy+=(ty-o.vy)*.4;
  if(st==='exit'){const k=c.w/36;o.g.position.set(lerp(c.x,EXIT.x,k),ty+Math.sin(k*Math.PI)*9,-k*20+bz(c.x));o.g.scale.setScalar(1-k*.8);}
  else{o.g.position.set(c.x,o.vy,bz(c.x));o.g.scale.setScalar(1);}
  const ry=st==='stop'?0:st==='fall'?dir*.3:work?dir*1.15:dir*.9;o.ry+=(ry-o.ry)*.16;o.g.rotation.y=o.ry+yawAt(c.x);
  const sw=walk?Math.sin(ph):0,cw=Math.cos(ph);
  o.up.position.y=walk?Math.abs(sw)*1.3:st==='dig'?-Math.abs(Math.sin(t*.4))*1.5:work?Math.abs(Math.sin(t*.21))*.8:0;
  o.up.rotation.z=st==='fall'&&!c.float?Math.sin(t*.35)*.2:sw*.05;
  o.up.rotation.x=work&&st!=='dig'?.12:0;
  if(st==='fall'){o.fl.position.set(-3.4,.4,1+Math.sin(t*.4)*1.2);o.fr.position.set(3.4,.4,1-Math.sin(t*.4)*1.2);}
  else{o.fl.position.set(-3.4,1.8+Math.max(0,cw)*1.7*Math.abs(sw),1+sw*3);o.fr.position.set(3.4,1.8+Math.max(0,-cw)*1.7*Math.abs(sw),1-sw*3);}
  const blink=((t+c.seed*400)%230)<6&&st!=='fall';o.eyes.scale.set(st==='fall'?1.15:1,blink?.12:st==='fall'?1.25:1,1);
  o.sprout.visible=st!=='build';o.sprout.rotation.z=Math.sin(t*.07+c.seed*20)*.25+sw*.1;o.sprout.scale.y=st==='fall'?1.3:1;
  o.hat.visible=st==='build';

  o.tool.visible=true;o.tool.rotation.set(0,0,0);
  if(st==='fall'){o.tool.visible=false;if(c.float){o.al.position.set(-1.7,16.3,1.5);o.ar.position.set(1.7,16.3,1.5);}else{o.al.position.set(-7.9,15.2,1);o.ar.position.set(7.9,15.2,1);}}
  else if(st==='stop'){o.tool.geometry=c.st==='bomb'?BG.berry:BG.sign;o.tool.position.set(10.6,8.6,1.5);o.al.position.set(-10.6,9.6,1);o.ar.position.set(10.6,9.6,1.5);}
  else if(st==='bash'){o.tool.geometry=BG.pick;if(c.did){const k=Math.sin(t*.42)*.5+.5;o.tool.position.set(6.6,8.6,4.5);o.tool.rotation.x=.1+k*1.5;o.ar.position.set(6.6,8.6,4.5);}else{o.tool.position.set(6.8,7.5,1.5);o.tool.rotation.set(-.5,0,-.25);o.ar.position.set(6.8,7.8,1.5);}}
  else if(st==='dig'){const dy=Math.sin(t*.4)*2.2;o.tool.geometry=BG.shovel;o.tool.position.set(0,8+dy,8.6);o.tool.rotation.x=.12;o.ar.position.set(2.6,11+dy,8.2);o.al.position.set(-2.6,8+dy,8.2);}
  else if(st==='build'){const k=Math.sin(t*.29)*.5+.5;o.tool.geometry=BG.hammer;o.tool.position.set(6.6,8.6,4.5);o.tool.rotation.x=-.3+k*1.6;o.ar.position.set(6.6,8.6,4.5);}
  else o.tool.visible=false;
  o.sol.visible=c.float;
  if(c.float){
    if(st==='fall'){const op=clamp((c.fall-10)/14,0,1);o.sol.position.set(0,13,1.5);o.sol.scale.set(.25+.75*op,1,.25+.75*op);o.sol.rotation.set(0,t*.02,Math.sin(t*.09)*.12);}
    else{o.sol.position.set(-2.5,3,-6.8);o.sol.scale.set(.2,.62,.2);o.sol.rotation.set(-.3,0,.25);}
  }

  o.jetm.visible=c.st==='fly'&&!!c.jet;o.band.visible=!!c.run;o.cap.visible=!!c.climb&&st!=='build';

}

e chameau est essoufflé.","Maintenant, on a envie de crêpes.","Une gorgée, un goûter et un petit plouf !","Boum ! C’était le goûter le plus bruyant du monde.","Tenez bien vos chapeaux de pique-nique !","On se rapproche des nuages !","Orteils gelés. Buds ravis.","Le. Meilleur. Vol.","Lumières allumées. Fusée prête !","Personne n’est tombé dans la neige. Enfin, presque personne.","Trois… deux… un… YOUPIIIII !","Un petit pas. Un très grand bond !","Si haut ! On a presque touché une étoile.","Merci, papillons de lune. Il est temps de rentrer !","Hop, par-dessus ! La fusée nous attend !","On est presque à la maison. Vous entendez la cloche ?","Tous les Buds sont à la maison !"]},"es":{"w":["Playa Soleada","Bahía Burbuja","Dunas Garabato","Monte Cohete","Cielo Estrellado"],"n":["Aterrizaje en la arena","El castillo tambaleante","Cruce de cangrejos","La roca mirador","El rebote playero","El barco burbuja","Burbujas para todos","El ascensor de burbujas","El meneo de las algas","La concha dormilona","El gran hueco azul","¡Arriba, arriba, burbuja!","Arena en los zapatos","Carrera con el camello","Las torres bamboleantes","El jardín de agua secreto","El cañón de las bayas pum","El Exprés de las Cometas","Las colinas esponjosas","Atajo bola de nieve","Vuelo de prueba","El taller del inventor","El trampolín nevado","¡Todos a bordo!","Una paradita en la Luna","Saltos lunares","El jardín de estrellas","Trepadores de cometas","¡Ahí está nuestro árbol!","En casa para cenar"],"o":["¡Hola, playa! Vamos a bajar a todos del globo.","¡Alguien ha construido un castillo justo en medio de nuestro camino!","Los cangrejos están de desfile. ¿Podremos cruzar sus charcas?","¡Qué roca tan grande! ¿Quién sube hasta arriba?","¡Boing! ¡Este colchón saltarín llega hasta arriba del todo!","¡Para llegar al Monte Cohete hay que cruzar el mar!","¡Una burbuja para ti, y otra burbuja para ti!","¡Sopla una burbuja y flota arriba, arriba, arriba!","En este jardín las plantas se menean un montón.","Una concha gigante se está echando la siesta en nuestro camino.","Ese hueco es muy hondo. ¡Menos mal que las burbujas vuelan!","Esas burbujas grandes suben a la superficie. ¡Vamos a montarnos!","La montaña aún queda lejos. ¡Sigamos al camello!","¡Qué escalones tan altos! Con pies rápidos se puede.","¡Estas rocas parecen torres gigantes de tortitas!","Nuestro amigo camello conoce un sitio fresquito para un pícnic.","Las bayas pum hacen ¡PUM! — ¡y abren agujeros muy prácticos!","¡Estas grandes cometas del desierto nos pueden llevar hasta las montañas!","¡Para arriba! Hasta las ovejas llevan abrigos esponjosos.","¡Nieve! Vamos a dejar huellas hasta arriba del todo.","El inventor tiene cohetes pequeñitos para nosotros. ¡Fiuuu!","¡Hola, Buds! ¿Hacia arriba? ¡A mi cohete le vendría bien una ayudita!","¡Salta alto, abre paso con un pum y cuidado con el hueco!","Cada uno a su asiento, pequeños Buds. Próxima parada: ¡el cielo!","El cohete necesita descansar. ¿Quién quiere pasear por la Luna?","¡En la Luna, un saltito llega lejísimos!","Aquí las polillas lunares cultivan estrellas brillantes. ¡Sigamos sus luces!","Una escalada para ti, una burbuja para ti. ¡Todos arriba!","¡Mira! ¡Buddletop! ¡Se ve el Árbol Hogar!","Suena la campana. ¡Llevemos a todos a casa!"],"e":["¿Todos juntos? ¡En marcha!","¡Gracias por la visita, pequeños caballeros!","¡Adiós, cangrejos! ¡Qué bonito caminar de lado!","¡Qué vista! ¡Se ve toda la playa!","¡Otra vez! ¡Otra vez! … Bueno, está bien, seguimos.","Próxima parada: ¡bajo las olas!","¡Caminar bajo el agua es como ir dando botes!","¡Plop! Todos han llegado arriba.","Menea, menea. ¡Y pasamos!","Shhh. Dejémosla dormir.","Flotando, flotando, sanos y salvos.","¡Hola otra vez, sol!","¿Todo el mundo tiene arena en los calcetines?","¡Uf! Hasta el camello se ha quedado sin aliento.","Ahora no paramos de pensar en tortitas.","¡Un trago, un bocado y un chapuzón!","¡Pum! Ha sido la merienda más ruidosa del mundo.","¡A sujetar bien los sombreros de pícnic!","¡Cada vez más cerca de las nubes!","Deditos helados. Buds felices.","El. Mejor. Vuelo.","Luces encendidas. ¡Cohete listo!","Nadie se ha caído en la nieve. Bueno, casi nadie.","Tres… dos… uno… ¡YUJUUUU!","Un pequeño paso. ¡Un salto enorme!","¡Qué alto! Casi tocamos una estrella.","Gracias, polillas lunares. ¡Hora de volver a casa!","Arriba y al otro lado. ¡El cohete nos espera!","Ya casi estamos en casa. ¿Se oye la campana?","¡Todos los Buds están en casa!"]},"it":{"w":["Spiaggia del Sole","Baia delle Bolle","Dune Scarabocchio","Monte Razzo","Cielo Stellato"],"n":["Atterraggio sulla sabbia","Il castello traballante","L’incrocio dei granchi","La roccia vedetta","Rimbalzi in spiaggia","La barca-bolla","Bolle per tutti","L’ascensore di bolle","Il balletto delle alghe","La conchiglia dormigliona","Il grande buco blu","Su, su, bolla!","Sabbia nelle scarpe","A gara col cammello","Le torri ballerine","Il giardino d’acqua segreto","Il canyon delle bacche-bum","L’Aquilone Express","Le colline soffici","La scorciatoia di neve","Volo di prova","L’officina dell’inventore","Il trampolino innevato","Tutti a bordo!","Una sosta sulla Luna","Salti lunari","Il giardino delle stelle","Scalatori di comete","Ecco il nostro albero!","A casa per cena"],"o":["Ciao, spiaggia! Facciamo scendere tutti dalla mongolfiera.","Qualcuno ha costruito un castello proprio in mezzo alla nostra strada!","I granchi fanno una parata. Riusciremo ad attraversare le loro pozze?","Che roccia enorme! Chi si arrampica fino in cima?","Boing! Questo cuscino salterino ci porta fin lassù!","Per arrivare al Monte Razzo dobbiamo attraversare il mare!","Una bolla per te, e una bolla per te!","Soffia una bolla e vola su, su, su!","In questo giardino le piante si dimenano un sacco.","Una conchiglia gigante fa un pisolino sulla nostra strada.","Quel buco è profondo. Meno male che le bolle sanno volare!","Quelle bollone salgono in superficie. Facciamoci dare un passaggio!","La montagna è ancora lontana. Seguiamo il cammello!","Che gradini alti! Con i piedi veloci ce la si fa.","Queste rocce sembrano pile giganti di frittelle!","Il nostro amico cammello conosce un posticino fresco per un picnic.","Le bacche-bum fanno BUM — e dei buchi molto comodi!","Questi grandi aquiloni del deserto possono portarci fino alle montagne!","Si sale! Perfino le pecore hanno cappotti soffici soffici.","Neve! Lasciamo le impronte fin lassù in cima.","L’inventore ha dei razzi piccolini per noi. Fiuuu!","Ciao, Buds! Andate su? Al mio razzo servirebbe proprio il vostro aiuto!","Salta in alto, apri un varco col botto e occhio al buco!","Trovate un posto, piccoli Buds. Prossima fermata: il cielo!","Il razzo ha bisogno di riposare. Chi vuole fare una passeggiata sulla Luna?","Sulla Luna, con un saltello si va lontanissimo!","Qui le falene lunari coltivano stelle luminose. Seguiamo le loro luci!","Una scalata per te, una bolla per te. Tutti su!","Guardate! Buddletop! Si vede l’Albero di Casa!","La campana suona. Portiamo tutti a casa!"],"e":["Ci siamo tutti? Si parte!","Grazie della visita, piccoli cavalieri!","Ciao ciao, granchi! Che bella camminata di lato!","Che vista! Si vede tutta la spiaggia!","Ancora! Ancora! … Va bene, andiamo avanti.","Prossima fermata: sotto le onde!","Camminare sott’acqua è tutto un rimbalzo!","Pop! Sono arrivati tutti in cima.","Dimena, dimena. E si passa!","Sssh. Lasciamola dormire.","Fluttua, fluttua, sani e salvi.","Rieccoti, sole!","Avete tutti la sabbia nei calzini?","Uff! Perfino il cammello ha il fiatone.","Adesso ci è venuta voglia di frittelle.","Un sorso, uno spuntino e un piccolo splash!","Bum! È stata la merenda più rumorosa di sempre.","Tenetevi stretti i cappelli da picnic!","Siamo sempre più vicini alle nuvole!","Piedini freddi. Buds felici.","Il. Volo. Più bello. Di sempre.","Luci accese. Razzo pronto!","Nessuno è caduto nella neve. Quasi nessuno.","Tre… due… uno… YUHUUUU!","Un piccolo passo. Un salto grandissimo!","Così in alto! Abbiamo quasi toccato una stella.","Grazie, falene lunari. È ora di tornare a casa!","Su e oltre. Il razzo ci aspetta!","Siamo quasi a casa. Sentite la campana?","Tutti i Buds sono a casa!"]},"pt":{"w":["Praia Ensolarada","Baía das Bolhas","Dunas Rabisco","Montanha Foguete","Céu Estrelado"],"n":["Pouso na areia","O castelo de areia bambo","Travessia dos caranguejos","A pedra do mirante","Pula-pula na praia","O barco-bolha","Bolhas para todo mundo","O elevador de bolhas","O rebolado das algas","A concha dorminhoca","O grande vão azul","Sobe, sobe, bolha!","Areia nos sapatos","Corrida com o camelo","As torres bambas","O jardim de água escondido","O cânion das frutas-estalo","O Expresso das Pipas","Os morros fofinhos","Atalho bola de neve","Voo de teste","A oficina do inventor","A rampa de esqui nevada","Todo mundo a bordo!","Uma paradinha na Lua","Pulinhos na Lua","O jardim das estrelas","Escaladores de cometas","Olha a nossa árvore!","Em casa para o jantar"],"o":["Olá, praia! Vamos tirar todo mundo do balão.","Alguém construiu um castelo bem no meio do nosso caminho!","Os caranguejos estão fazendo um desfile. Será que dá para atravessar as pocinhas deles?","Que pedra enorme! Quem consegue subir até o topo?","Boing! Este pula-pula leva a gente lá para cima!","Para chegar à Montanha Foguete, precisamos atravessar o mar!","Uma bolha para você, e uma bolha para você!","Sopre uma bolha e flutue para cima, para cima, para cima!","Neste jardim, as plantas rebolam bastante.","Uma concha gigante está tirando uma soneca no nosso caminho.","Esse vão é fundo. Ainda bem que bolhas sabem voar!","Essas bolhas grandes estão subindo para a superfície. Vamos pegar carona!","A montanha ainda está longe. Sigam o camelo!","Que degraus altos! Pezinhos rápidos conseguem.","Estas pedras parecem pilhas gigantes de panquecas!","Nosso amigo camelo conhece um lugar fresquinho para um piquenique.","As frutas-estalo fazem BUM — e abrem buracos muito úteis!","Estas pipas grandes do deserto podem nos levar até as montanhas!","Lá vamos nós! Até as ovelhas usam casacos fofinhos.","Neve! Vamos deixar pegadas até lá em cima.","O inventor tem foguetinhos para a gente. Vupt!","Olá, Buds! Vão subir? Meu foguete bem que precisa da ajuda de vocês!","Pule bem alto, abra passagem com um estouro e cuidado com o vão!","Achem um lugar, pequenos Buds. Próxima parada: o céu!","O foguete precisa descansar. Quem quer passear na Lua?","Na Lua, um pulinho vai longe!","Aqui, as mariposas lunares cultivam estrelas brilhantes. Vamos seguir as luzes delas!","Uma escalada para você, uma bolha para você. Todo mundo para cima!","Olhem! Buddletop! Dá para ver a Árvore-Lar!","O sino está tocando. Vamos levar todo mundo para casa!"],"e":["Todo mundo junto? Lá vamos nós!","Obrigado pela visita, pequenos cavaleiros!","Tchau, caranguejos! Que lindo andar de ladinho!","Que vista! Dá para ver a praia inteira!","De novo! De novo! … Tá bom, vamos em frente.","Próxima parada: debaixo das ondas!","Andar debaixo d’água é cheio de pulinhos!","Ploc! Todo mundo chegou lá em cima.","Rebola, rebola. E passamos!","Shhh. Vamos deixar ela dormir.","Flutua, flutua, sãos e salvos.","Olá de novo, sol!","Todo mundo está com areia nas meias?","Ufa! Até o camelo ficou sem fôlego.","Agora só pensamos em panquecas.","Um gole, um lanchinho e um mergulhinho!","Bum! Foi o lanche mais barulhento de todos.","Segurem seus chapéus de piquenique!","Estamos chegando perto das nuvens!","Dedinhos gelados. Buds felizes.","Melhor. Voo. De todos.","Luzes acesas. Foguete pronto!","Ninguém caiu na neve. Quase ninguém.","Três… dois… um… UHUUUUL!","Um pequeno passo. Um pulo bem grandão!","Que alto! Quase tocamos uma estrela.","Obrigado, mariposas lunares. Hora de ir para casa!","Para cima e adiante. O foguete está esperando!","Estamos quase em casa. Dá para ouvir o sino?","Todos os Buds estão em casa!"]},"nl":{"w":["Zonnestrand","Bubbelbaai","Krabbelduinen","Raketberg","Sterrenhemel"],"n":["Een zanderige landing","Het wiebelige zandkasteel","Krabbenoversteek","De uitkijkrots","Strandbal-stuiter","De bellenboot","Bellen voor iedereen","De bellenlift","De zeewierwiebel","De slaperige schelp","De diepblauwe kloof","Omhoog, omhoog, bel!","Zand in onze schoenen","Wedloop met de kameel","De wankele torens","De verborgen watertuin","De knalbessenkloof","De Vlieger-Express","De pluizige heuvels","Sneeuwbal-sluiproute","Testvlucht","De uitvinderswerkplaats","De sneeuwschans","Allemaal aan boord!","Een kleine maanstop","Maanhuppel","De sterrentuin","Komeetklimmers","Daar is onze boom!","Thuis voor het avondeten"],"o":["Hallo, strand! Kom, we halen iedereen uit de ballon.","Iemand heeft een kasteel gebouwd, midden op ons pad!","De krabben houden een optocht. Komen we over hun poeltjes heen?","Wat een grote rots! Wie klimt er naar de top?","Boing! Dit springkussen gaat helemaal naar boven!","Om bij de Raketberg te komen, moeten we de zee over!","Een bel voor jou, en een bel voor jou!","Blaas een bel en zweef omhoog, omhoog, omhoog!","In deze tuin wiebelen de planten heel erg.","Een reuzenschelp doet een dutje, precies op ons pad.","Die kloof is diep. Gelukkig kunnen bellen vliegen!","Die grote bellen gaan naar boven. Kom, we liften mee!","Die berg is nog ver weg. Volg de kameel!","Wat een hoge treden! Met snelle voetjes lukt het.","Deze rotsen lijken wel reuzenstapels pannenkoeken!","Onze kameelvriend weet een koel plekje voor een picknick.","Knalbessen doen BOEM — en maken handige gaten!","Deze grote woestijnvliegers kunnen ons naar de bergen dragen!","Daar gaan we, omhoog! Zelfs de schapen dragen pluizige jassen.","Sneeuw! We maken voetstappen tot helemaal bovenaan.","De uitvinder heeft kleine raketjes voor ons. Zoef!","Hallo, Buds! Naar boven? Mijn raket kan jullie hulp goed gebruiken!","Stuiter omhoog, knal erdoorheen en pas op voor de kloof!","Zoek een plekje, kleine Buds. Volgende halte: de lucht!","De raket moet even uitrusten. Wie wil er wandelen op de maan?","Op de maan kom je met een klein sprongetje heel ver!","Maanmotten kweken hier lichtgevende sterren. Kom, we volgen hun lichtjes!","Een klim voor jou, een bel voor jou. Iedereen omhoog!","Kijk! Buddletop! We zien de Thuisboom!","De bel luidt. Kom, we brengen iedereen naar huis!"],"e":["Iedereen bij elkaar? Daar gaan we!","Bedankt voor het bezoek, kleine ridders!","Dag, krabben! Wat liepen jullie mooi zijwaarts!","Wat een uitzicht! We zien het hele strand!","Nog een keer! Nog een keer! … Oké, verder.","Volgende halte: onder de golven!","Lopen onder water voelt heel stuiterig!","Plop! Iedereen is boven.","Wiebel, wiebel. We zijn erdoor!","Sssst. Laat hem maar slapen.","Zweef, zweef, veilig geland.","Hallo weer, zonnetje!","Heeft iedereen zand in zijn sokken?","Pfoe! Zelfs de kameel is buiten adem.","Nu denken we aan pannenkoeken.","Een slokje, een hapje en een kleine plons!","Boem! Dat was het luidste hapje ooit.","Hou je picknickhoed goed vast!","We komen steeds dichter bij de wolken!","Koude tenen. Blije Buds.","Beste. Vlucht. Ooit.","Lichten aan. Raket klaar!","Niemand viel in de sneeuw. Bijna niemand.","Drie… twee… één… JOEPIEEEE!","Eén kleine stap. Eén heel grote sprong!","Zo hoog! We raakten bijna een ster aan.","Dank je wel, maanmotten. Tijd om naar huis te gaan!","Eroverheen en verder. De raket wacht!","We zijn bijna thuis. Hoor je de bel?","Alle Buds zijn thuis!"]},"pl":{"w":["Słoneczny Brzeg","Zatoka Baniek","Bazgrołowe Wydmy","Rakietowa Góra","Gwiaździste Niebo"],"n":["Lądowanie na piasku","Chwiejny zamek z piasku","Krabie przejście","Skała widokowa","Plażowe podskoki","Bańkowa łódka","Bańki dla wszystkich","Bańkowa winda","Wodorostowe wygibasy","Śpiąca muszla","Głęboka błękitna szczelina","W górę, w górę, bańko!","Piasek w butach","Wyścig z wielbłądem","Chybotliwe wieże","Ukryty wodny ogród","Kanion bum-jagód","Latawcowy ekspres","Puszyste pagórki","Śnieżkowy skrót","Lot próbny","Pracownia wynalazcy","Śnieżna skocznia","Wszyscy na pokład!","Mały postój na Księżycu","Księżycowe skoki","Gwiezdny ogród","Kometowi wspinacze","Tam jest nasze drzewo!","Do domu na kolację"],"o":["Witaj, plażo! Pomóżmy wszystkim wysiąść z balonu.","Ktoś zbudował zamek na samym środku naszej drogi!","Kraby urządziły paradę. Czy uda nam się przejść przez ich sadzawki?","Ale wielka skała! Kto wdrapie się na szczyt?","Boing! Ta skoczna poduszka wyniesie nas na samą górę!","Żeby dotrzeć do Rakietowej Góry, musimy przeprawić się przez morze!","Bańka dla ciebie i bańka dla ciebie!","Dmuchnij bańkę i leć w górę, w górę, w górę!","W tym ogrodzie rośliny wyginają się na wszystkie strony.","Wielka muszla ucięła sobie drzemkę na naszej drodze.","Ta szczelina jest głęboka. Dobrze, że bańki umieją latać!","Te wielkie bańki płyną na powierzchnię. Zabierzmy się z nimi!","Do góry jeszcze daleko. Za wielbłądem!","Ale wysokie stopnie! Szybkie nóżki dadzą radę.","Te skały wyglądają jak ogromne stosy naleśników!","Nasz przyjaciel wielbłąd zna chłodne miejsce na piknik.","Bum-jagody robią BUM — i bardzo przydatne dziury!","Te wielkie pustynne latawce zaniosą nas w góry!","W górę! Nawet owce noszą tu puszyste płaszczyki.","Śnieg! Zostawmy ślady aż na samą górę.","Wynalazca ma dla nas malutkie rakiety. Wziuuu!","Cześć, Buds! W górę? Mojej rakiecie przyda się wasza pomoc!","Podskocz wysoko, przebij się z hukiem i uważaj na szczelinę!","Zajmijcie miejsca, małe Buds. Następny przystanek: niebo!","Rakieta musi odpocząć. Kto ma ochotę na spacer po Księżycu?","Na Księżycu mały podskok niesie bardzo daleko!","Księżycowe ćmy hodują tu świecące gwiazdki. Chodźmy za ich światełkami!","Wspinaczka dla ciebie, bańka dla ciebie. Wszyscy w górę!","Patrzcie! Buddletop! Widać Domowe Drzewo!","Dzwon dzwoni. Zaprowadźmy wszystkich do domu!"],"e":["Wszyscy razem? No to w drogę!","Dziękujemy za wizytę, mali rycerze!","Pa, pa, kraby! Pięknie chodzicie bokiem!","Ale widok! Widać całą plażę!","Jeszcze raz! Jeszcze raz! … No dobrze, idziemy dalej.","Następny przystanek: pod falami!","Pod wodą chodzi się bardzo skocznie!","Pyk! Wszyscy dotarli na górę.","Wygibas, wygibas. I przeszliśmy!","Ciii. Niech sobie śpi.","Lecimy, lecimy, cali i zdrowi.","Witaj znowu, słoneczko!","Czy wszyscy mają piasek w skarpetkach?","Uff! Nawet wielbłąd się zasapał.","Teraz myślimy o naleśnikach.","Łyk wody, przekąska i małe chlap!","Bum! To była najgłośniejsza przekąska na świecie.","Trzymajcie swoje piknikowe kapelusze!","Jesteśmy coraz bliżej chmur!","Zmarznięte paluszki. Szczęśliwe Buds.","Najlepszy. Lot. Na świecie.","Światła włączone. Rakieta gotowa!","Nikt nie wpadł w śnieg. No, prawie nikt.","Trzy… dwa… jeden… JUHUUUU!","Jeden mały krok. Jeden ogromny sus!","Ale wysoko! Prawie dotknęliśmy gwiazdy.","Dziękujemy, księżycowe ćmy. Czas wracać do domu!","Hop na drugą stronę. Rakieta czeka!","Jesteśmy prawie w domu. Słyszycie dzwon?","Wszystkie Buds są w domu!"]},"tr":{"w":["Güneşli Kıyılar","Baloncuk Koyu","Karalama Kumulları","Roket Dağı","Yıldızlı Gökler"],"n":["Kumlu Bir İniş","Sallanan Kumdan Kale","Yengeç Geçidi","Gözcü Kayası","Plaj Topu Zıplaması","Baloncuk Teknesi","Herkese Baloncuk","Baloncuk Asansörü","Yosun Dansı","Uykucu Deniz Kabuğu","Derin Mavi Uçurum","Yukarı, Yukarı, Baloncuk!","Ayakkabılarda Kum","Deveyle Yarış","Yalpalayan Kuleler","Gizli Su Bahçesi","Pat-Pat Yemişi Kanyonu","Uçurtma Ekspresi","Pofuduk Yamaçlar","Kartopu Kestirmesi","Deneme Uçuşu","Mucidin Atölyesi","Karlı Atlama Rampası","Herkes Binsin!","Küçük Bir Ay Molası","Ay Zıplaması","Yıldız Bahçesi","Kuyruklu Yıldız Tırmanışı","İşte Bizim Ağaç!","Akşam Yemeğine Evde"],"o":["Merhaba, kumsal! Haydi herkesi balondan indirelim.","Biri tam yolumuzun üstüne bir kale yapmış!","Yengeçler geçit töreni yapıyor. Havuzcuklarının üstünden geçebilir miyiz?","Ne kocaman bir kaya! Tepesine kim tırmanacak?","Zıp! Bu zıpzıp yastık bizi ta yukarıya çıkarır!","Roket Dağı’na ulaşmak için denizi aşmalıyız!","Bir baloncuk sana, bir baloncuk da sana!","Bir baloncuk üfle ve süzül: yukarı, yukarı, yukarı!","Bu bahçedeki bitkiler pek bir kıpır kıpır.","Dev bir deniz kabuğu yolumuzun üstünde şekerleme yapı   g.beginPath();g.moveTo(x0+12,18);g.lineTo(x1-12,18);g.quadraticCurveTo(x1,18,x1,30);g.lineTo(x1,84);g.quadraticCurveTo(x1,96,x1-12,96);g.lineTo(x0+12,96);g.quadraticCurveTo(x0,96,x0,84);g.lineTo(x0,30);g.quadraticCurveTo(x0,18,x0+12,18);g.closePath();
  g.fillStyle=col;g.fill();g.lineWidth=7;g.strokeStyle=INK;g.stroke();
  g.beginPath();g.moveTo(x0+14,27);g.lineTo(x1-14,27);g.lineWidth=4;g.strokeStyle='rgba(255,255,255,.7)';g.lineCap='round';g.stroke();
  g.fillStyle=INK;g.fillText(txt,256,59,372);
}
/* called at the end of selectLevel and openMap */
function mapSelected(i){if(i!==MX.selI){MX.selI=i;MX.selT=T;}}
function mapOpened(){
  MX.sv=MX.zv=MX.rv=MX.rb=0;MX.openSel=MAP.sel;MX.hold=-1;MX.goT=0;
  if(!lab('mapStops'))return;
  /* a stop that opened since the last visit stays grey for a moment, then pops open with sparkles - once (SAVE.mapSeen remembers) */
  let hi=0;while(hi<NLV-1&&unlocked(hi+1))hi++;
  if(SAVE.mapSeen==null||hi-SAVE.mapSeen!==1||RMQ.matches){if(SAVE.mapSeen!==hi){SAVE.mapSeen=hi;persist();}return;}
  SAVE.mapSeen=hi;persist();MX.hold=hi;MX.unT=T+.9;drawMapNodes();
}
/* mapCam: springs instead of plain easing (a slight overshoot); returns true when it has moved the camera values itself */
function mapCamStep(dt){
  if(!(MX.cam=lab('mapCam')&&!RMQ.matches))return false;
  const n=dt>.02?2:1,h=dt/n;
  for(let q=0;q<n;q++){MX.sv+=((MAP.st-MAP.s)*70-MX.sv*13)*h;MAP.s+=MX.sv*h;MX.zv+=((MAP.zt-MAP.zm)*110-MX.zv*15.5)*h;MAP.zm+=MX.zv*h;MX.rv+=((MAP.rt-MAP.rot)*90-MX.rv*15)*h;MAP.rot+=MX.rv*h;}
  MAP.zm=Math.max(.3,MAP.zm);
  return true;
}
/* mapCam: pulling past the first or last stop stretches the view a little; it springs back on release */
function mapRubber(F,dt){
  if(!MX.rb)return;const e=MX.rb<0?0:NLV-2,a=MAP.pts[e],b=MAP.pts[e+1];F.x+=(b.x-a.x)*MX.rb;F.z+=(b.z-a.z)*MX.rb;
  if(!MX.drag){MX.rb*=Math.exp(-dt*9);if(Math.abs(MX.rb)<.003)MX.rb=0;}
}
/* everything on the map that moves on its own; runs once a frame after the Bud and the ring have been placed, before the picture is drawn */
function mapLive(t,dt){
  const o=MX.o,B=MX.base,stops=lab('mapStops'),life=lab('mapLife')&&!RMQ.matches,isl=life?Math.sin(t*.7)*2.6:0;
  /* --- mapLife --- */
  MX.uCl.value.set(t*.011,t*.0045,life?1:0);
  if(life||MX.lifeOn){MX.lifeOn=life;
    for(let i=0;i<B.boat.length;i++){const m=B.boat[i],q=i>3?3:i;m.position.y=B.boatY[i]+(life?Math.sin(t*1.25+q*2.1)*.9:0);m.rotation.z=life?Math.sin(t*1.05+q*1.7)*.07:0;}
    if(B.kite)for(const m of B.kite)m.rotation.z=life?Math.sin(t*.8)*.07:0;
    for(let i=0;i<B.isl.length;i++)B.isl[i].position.y=B.islY[i]+isl;
    for(let i=NLV-2;i<NLV;i++){MAP.nodes[i].m.position.y=B.nodeY[i]+isl;MAP.nodes[i].sp.position.y=B.spY[i]+isl;}
    if(MX.sheep){const m=MX.sheep;for(let i=0;i<m.count;i++){MX.m4.copy(B.sheep[i]);if(life)MX.m4.elements[13]+=Math.max(0,Math.sin(t*.8+i*2.4)-.84)*26;m.setMatrixAt(i,MX.m4);}m.instanceMatrix.needsUpdate=true;}
    if(MX.cloud){const m=MX.cloud;for(let i=0;i<m.count;i++){MX.m4.copy(B.cloud[i]);if(life){MX.m4.elements[12]+=Math.sin(t*.045+i*1.9)*46;MX.m4.elements[13]+=Math.sin(t*.3+i)*2.5;}m.setMatrixAt(i,MX.m4);}m.instanceMatrix.needsUpdate=true;}
    MX.smoke.visible=life;MX.glint.visible=life;
    if(life){
      for(let i=0;i<7;i++){const ph=(t*.16+i/7)%1,s=Math.sin(ph*Math.PI)*(5+(i%3)*1.6);o.position.set(1542+ph*36+Math.sin(i*2.3+t*.4)*3,MX.smokeY+4+ph*50,-70-ph*8);o.rotation.set(0,i+t*.2,0);o.scale.setScalar(Math.max(.001,s));o.updateMatrix();MX.smoke.setMatrixAt(i,o.matrix);}
      MX.smoke.instanceMatrix.needsUpdate=true;
      const c=MX.glint.geometry.attributes.color,ca=c.array,n=MX.glint.geometry.drawRange.count;for(let i=0;i<n;i++){const v=Math.pow(Math.max(0,Math.sin(t*1.1+i*2.7)),9);ca[i*3]=v;ca[i*3+1]=v;ca[i*3+2]=v*.9;}c.needsUpdate=true;
    }
  }
  /* --- mapBanners: far out the ribbons shrink so that the names do not cover each other --- */
  if(lab('mapBanners')){const k=Math.min(1,2.75/Math.max(.8,Math.pow(MAP.zm,.8)));if(k<1)for(const b of MAP.ban)b.sp.scale.multiplyScalar(k);}
  /* --- mapWalk: the Bud hops along the dotted path to the chosen stop (it waits at the last open one if that stop is still closed) --- */
  const bud=MAP.bud;let home=curLevel();
  if(lab('mapWalk')){
    const tg=unlocked(MAP.sel)?MAP.sel:curLevel();if(MX.bp==null||RMQ.matches)MX.bp=tg;
    const d=tg-MX.bp,ad=Math.abs(d);let dir=0;
    if(ad>.0005){const v=Math.max(2.3,ad*2.4)*dt;MX.bp=ad<=v?tg:MX.bp+Math.sign(d)*v;dir=Math.sign(d);MX.bmove=Math.min(1,MX.bmove+dt*9);}else MX.bmove=Math.max(0,MX.bmove-dt*4);
    const i=Math.min(NLV-2,Math.floor(MX.bp)),f=MX.bp-i,a=MAP.pts[i],c=MAP.pts[i+1],x=lerp(a.x,c.x,f),zz=lerp(a.z,c.z,f),m=MX.bmove,rest=1-m;
    let y=i>=23?lerp(a.y,c.y,f)+Math.sin(f*Math.PI)*(i===23||i===27?34:5):Math.max(mapH(x,zz)+1.6,lerp(a.y,c.y,f)-2);
    y=Math.max(y,-1)+(MX.bp>NLV-2.5?isl:0);
    const hop=lerp(Math.abs(Math.sin(t*3.2))*7,Math.abs(Math.sin(MX.bp*Math.PI*3))*8,m);
    bud.position.set(x-19*rest,y-1.5*rest+hop,zz+7*rest);
    const want=dir?Math.atan2((c.x-a.x)*dir,(c.z-a.z)*dir):Math.sin(t*.9)*.5;let da=want-MX.bry;da=Math.atan2(Math.sin(da),Math.cos(da));MX.bry+=da*(1-Math.exp(-dt*(dir?14:5)));bud.rotation.y=MX.bry;
    home=Math.round(MX.bp);
  }else{MX.bp=null;MX.bmove=0;MX.bry=bud.rotation.y;if(curLevel()>=NLV-2)bud.position.y+=isl;}
  if(MAP.sel>=NLV-2)MAP.ring.position.y+=isl;
  /* --- mapStops: flags, the chosen stop bounces, a new stop pops open, "you are here" --- */
  if(MX.hold>=0&&(t>=MX.unT||!stops)){MX.popI=MX.hold;MX.popT=t;MX.hold=-1;drawMapNodes();if(stops){sfx('ui');buzz(16);MX.goT=t+.55;}}
  if(MX.goT&&t>=MX.goT){MX.goT=0;if(mode==='map'&&MAP.sel===MX.openSel&&!MX.drag)selectLevel(MX.popI);}
  const pk=t-MX.popT,sk=t-MX.selT;
  for(let i=0;i<NLV;i++){const nd=MAP.nodes[i];let s=1;
    if(stops&&!RMQ.matches){if(i===MX.selI&&sk<.8)s+=.3*Math.exp(-sk*5)*Math.cos(sk*17);if(i===MX.popI&&pk<1.1)s+=.6*Math.exp(-pk*3.5)*Math.cos(pk*13);}
    if(s!==1||nd.m.scale.x!==1){nd.m.scale.set(s,1+(s-1)*1.8,s);nd.sp.scale.multiplyScalar(s);}}
  MX.flags.visible=stops;MX.here.visible=stops&&!RMQ.matches;
  if(stops){
    for(let i=0;i<NLV;i++){const p=MAP.pts[i],has=SAVE.stars[i]>0;o.position.set(p.x+10.5,(p.y<-3?.9:p.y-1)+(i>=NLV-2?isl:0),p.z-9.5);o.rotation.set(0,.5+Math.sin(t*1.9+i*1.3)*.4,Math.sin(t*1.3+i)*.04);o.scale.setScalar(has?1:.0001);o.updateMatrix();MX.flags.setMatrixAt(i,o.matrix);}
    MX.flags.instanceMatrix.needsUpdate=true;
    const p=MAP.pts[home],k=(t*.6)%1,h=MX.here;h.position.set(p.x,(p.y<-3?2.6:p.y+1.4)+(home>=NLV-2?isl:0),p.z);h.scale.setScalar(1+k*1.15);h.material.opacity=.85*(1-k)*(1-k);
    const sp=MX.spk;sp.visible=pk<1.3;
    if(sp.visible){const q=MAP.pts[MX.popI],pa=sp.geometry.attributes.position,ca=sp.geometry.attributes.color,e=1-Math.pow(1-clamp(pk/1.3,0,1),2),v=clamp(1.5-pk*1.25,0,1);
      for(let j=0;j<16;j++){const a=j/16*TAU+j*.37,r=(14+(j%4)*9)*e;pa.array[j*3]=q.x+Math.cos(a)*r;pa.array[j*3+1]=Math.max(q.y,0)+8+e*(18+(j%5)*7)-pk*pk*6;pa.array[j*3+2]=q.z+Math.sin(a)*r;ca.array[j*3]=v;ca.array[j*3+1]=v*.9;ca.array[j*3+2]=v*.55;}
      pa.needsUpdate=ca.needsUpdate=true;}
  }else MX.spk.visible=false;
}
